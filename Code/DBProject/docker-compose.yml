version: "3.8"

# =============================================================================
# Clinic Management System - Docker Compose
# Application service ONLY - no infrastructure services
# External services (SQL Server, Redis) are provided separately
# =============================================================================

services:
  clinic-management-system:
    build:
      context: ../..
      dockerfile: Code/DBProject/Dockerfile
    image: clinic-management-system:latest
    container_name: clinic-management-system
    ports:
      - "80:80"
    environment:
      # ASP.NET environment
      - ASPNET_ENV=Production
      # SQL Server connection string - provide via environment or secrets
      - SQL_CONNECTION_STRING=${SQL_CONNECTION_STRING:-Data Source=sqlserver;Initial Catalog=DBProject;User Id=sa;Password=YourPassword123!}
      # Redis connection string for session state - provide via environment or secrets
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}
      # Application Insights instrumentation key (optional)
      - APPINSIGHTS_INSTRUMENTATIONKEY=${APPINSIGHTS_INSTRUMENTATIONKEY:-}
    volumes:
      - clinic-logs:C:/inetpub/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command",
             "try { $r = Invoke-WebRequest -Uri 'http://localhost/Health.aspx' -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  clinic-logs:
    driver: local

networks:
  app-network:
    driver: bridge
